name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test Plugin Structure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install fz framework
      run: |
        pip install git+https://github.com/Funz/fz.git
     
    - name: Validate JSON files
      run: |
        echo "Validating model files..."
        for f in .fz/models/*.json; do
          echo "  Checking $f"
          python -m json.tool "$f" > /dev/null
        done
        echo "Validating calculator config files..."
        for f in .fz/calculators/*.json; do
          echo "  Checking $f"
          python -m json.tool "$f" > /dev/null
        done
    
    - name: Check shell script syntax
      run: |
        echo "Checking shell scripts..."
        for f in .fz/calculators/*.sh; do
          echo "  Checking $f"
          bash -n "$f"
        done
    
    - name: Run wrapper tests (mock CASMO5 launcher + output fixtures)
      run: |
        pip install pytest
        pytest tests/ -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Check shell scripts are executable
      run: |
        for f in .fz/calculators/*.sh; do
          if [ ! -x "$f" ]; then
            echo "Error: $f is not executable"
            exit 1
          fi
        done

  docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Check required documentation files
      run: |
        for f in README.md LICENSE; do
          if [ ! -f "$f" ]; then
            echo "Error: Missing $f"
            exit 1
          fi
          echo "✓ $f exists"
        done
    
    - name: Check example files
      run: |
        if [ ! -f "examples/CASMO/input.inp" ]; then
          echo "Error: Missing example input file"
          exit 1
        fi
        echo "✓ Example files present"
